name: Build Windows Portable EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Tesseract OCR
        shell: pwsh
        run: choco install tesseract -y --no-progress

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name Delivery_Order_QR_Generator `
            --collect-all fitz `
            --collect-all pytesseract `
            delivery_order_qr_generator.py

      - name: Bundle portable Tesseract OCR
        shell: pwsh
        run: |
          $tesseractDir = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tesseractDir\tesseract.exe")) {
            $command = Get-Command tesseract.exe -ErrorAction Stop
            $tesseractDir = Split-Path $command.Source -Parent
          }
          Copy-Item $tesseractDir `
            "dist/Delivery_Order_QR_Generator/tesseract" `
            -Recurse -Force
          Copy-Item README_TH.txt `
            "dist/Delivery_Order_QR_Generator/README_TH.txt" -Force

      - name: Verify portable package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Delivery_Order_QR_Generator/Delivery_Order_QR_Generator.exe")) {
            throw "EXE not found"
          }
          if (-not (Test-Path "dist/Delivery_Order_QR_Generator/tesseract/tesseract.exe")) {
            throw "Portable OCR not found"
          }

      - name: Upload Windows Portable package
        uses: actions/upload-artifact@v4
        with:
          name: Delivery-Order-QR-Generator-Windows-Portable-v0.7.2
          path: dist/Delivery_Order_QR_Generator/
          if-no-files-found: error
          retention-days: 30
